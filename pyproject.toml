[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kvdbclient"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "zstandard>=0.23.0",
    "pytz",
    "google-cloud-bigtable>=2.26.0",
    "requests>=2.25.0",
    "tenacity",
]

[project.optional-dependencies]
extensions = ["tensorstore"]

[tool.setuptools.packages.find]
include = ["kvdbclient*"]

[tool.setuptools_scm]
fallback_version = "0.7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Connecting to Bigtable emulator:RuntimeWarning",
    "ignore:urllib3",
]
