name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      part:
        description: "Semver part to bump"
        type: choice
        required: true
        default: patch
        options: [major, minor, patch]
      dry-run:
        description: "Dry run — compute the next version, do not tag or publish"
        type: boolean
        required: true
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    env:
      BIGTABLE_EMULATOR_HOST: localhost:8086

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start BigTable emulator
        run: |
          docker run -d -p 8086:8086 --name bigtable-emulator \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators bigtable start --host-port=0.0.0.0:8086
          timeout 30 bash -c 'until nc -z localhost 8086; do sleep 1; done'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests with coverage
        run: pytest --cov=kvdbclient --cov-report=xml tests/

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  version:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Next version from the latest tag
        id: ver
        run: |
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          latest="${latest#v}"
          [ -z "$latest" ] && latest="0.0.0"
          IFS=. read -r major minor patch <<< "$latest"
          case "${{ github.event.inputs.part }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
      - name: Summary
        run: echo "next v${{ steps.ver.outputs.version }} (dry-run=${{ github.event.inputs.dry-run }})"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'false'
    needs: version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # push the tag
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Tag and push
        run: |
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
